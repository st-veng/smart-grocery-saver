<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Compare grocery prices across DFW stores and save 10–25%." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Smart Grocery Saver</title>
    <script>
      // Apply the theme before first paint (no flash). Mirrors src/lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem('sgs-theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
